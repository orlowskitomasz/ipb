# Wystawia gotową aplikację (dist/) pod adresem https://orlowskitomasz.github.io/ipb/
# Jednorazowo w repozytorium: Settings → Pages → Source: GitHub Actions.
# Mapa OSM działa tylko ze strony https – z pliku na dysku serwer map odmawia (docs/HOSTING.md).
name: Strona
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  wystaw:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: wdrozenie
        uses: actions/deploy-pages@v4
